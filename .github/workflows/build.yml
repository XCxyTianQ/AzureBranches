name: Patch and Build

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  build:
    # Only run on PRs if the source branch is on someone else's repo
    if: ${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Configure Git User Details
        run: git config --global user.email "actions@github.com" && git config --global user.name "Github Actions"
      # The root project has no applyAllPatches task: it lives inside the cloned
      # Folia tree and is driven by :azurebranches-server:buildFolia (which also
      # runs cloneFolia, the azurepatches overlays and createPaperclipJar).
      # The runner has ~7 GB RAM; cap the Gradle heap to leave room for the
      # nested Folia build spawned by buildFolia.
      # repo.papermc.io intermittently returns 502: enable Gradle repository
      # retries and wrap the step in a retry loop.
      - name: Build Folia (clone + applyAllPatches + paperclip)
        run: |
          for i in 1 2 3; do
            if ./gradlew :azurebranches-server:buildFolia --no-configuration-cache --stacktrace \
                -Dorg.gradle.jvmargs=-Xmx4G \
                -Dorg.gradle.internal.repository.max.tentatives=10 \
                -Dorg.gradle.internal.repository.initial.backoff=1000; then
              exit 0
            fi
            echo "::warning::buildFolia attempt $i failed, retrying in 15s"
            sleep 15
          done
          exit 1
      - name: Merge AzureBranches classes (EXP5Plus jar)
        run: |
          for i in 1 2 3; do
            if ./gradlew :azurebranches-server:mergeJar --no-configuration-cache --stacktrace \
                -Dorg.gradle.jvmargs=-Xmx4G \
                -Dorg.gradle.internal.repository.max.tentatives=10 \
                -Dorg.gradle.internal.repository.initial.backoff=1000; then
              exit 0
            fi
            echo "::warning::mergeJar attempt $i failed, retrying in 15s"
            sleep 15
          done
          exit 1
